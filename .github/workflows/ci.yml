name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The first run builds Spinel from source; later runs use mise-action's cache.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The Ruby in .ruby-version.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.343.0
        with:
          bundler-cache: true
      # Everything in mise.toml: the WASI SDK (bin/build needs it), Spinel,
      # Node.js, and pnpm.
      - name: Install the tools
        uses: jdx/mise-action@v5.3.0
      # `edgeway test` runs the tests on the local D1 of wrangler.
      - name: Install wrangler
        run: pnpm install
      - name: Run the tests
        run: bin/test
      - name: Build
        run: bin/build --release
